<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Web Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            color: white;
        }

        /* Navbar Keren dengan Efek Glassmorphism */
        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); /* Efek blur kaca */
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 300;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Efek garis bawah saat hover */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background: #ff7eb3;
            bottom: -5px;
            left: 0;
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: #ff7eb3;
        }

        nav a:hover::after {
            width: 100%;
        }

        .content {
            padding: 50px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">MYBRAND</div>
        <ul>
            <li><a href="#">Beranda</a></li>
            <li><a href="#">Tentang</a></li>
            <li><a href="#">Portofolio</a></li>
            <li><a href="#">Kontak</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>Selamat Datang</h1>
        <p>Ini adalah tampilan website dengan navbar yang lebih modern.</p>
    </div>

</body>
</html>
